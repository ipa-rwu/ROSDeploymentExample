version: '3'
networks:
  ros-network:
    external: false
    driver: "bridge"
  ur5e:
    driver: bridge
    driver_opts:
      parent: eno1

services:
  bt_framework:
    image: registry.gitlab.cc-asp.fraunhofer.de/ipa326/demonstrator/50y-robotic-demo/bt_framework_humble:50y_v1.0.1
    volumes:
      - ./cyclonedds.xml:/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros-network
    environment:
      - NETINTERFACE=eth0
      - DISPLAY=${DISPLAY}
      # for application
      - moveit_pkg_name=ur5e_cell_moveit_config
      - use_sim_time=false
      - robot_name=ur5e_workcell
    stdin_open: true # docker run -i
    tty: true # docker run -t
    command:
      - bash
      - -c
      - |
        export CYCLONEDDS_URI=file:///cyclonedds.xml
        source /ros_entrypoint.sh
        ros2 launch man2_bt_bringup bringup_skills_ur5e_cell.launch.py use_sim_time:=false 
  launch_realsense:
    image: registry.gitlab.cc-asp.fraunhofer.de/ipa326/demonstrator/50y-robotic-demo/launch_realsense_humble:50y_v1.0.1
    volumes:
      - ./cyclonedds.xml:/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros-network
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
    environment:
      - NETINTERFACE=eth0
      - DISPLAY=${DISPLAY}
      # for application
      - rotation_z=-0.467606
      - rotation_y=0.53423
      - rotation_w=-0.463867
      - child_frame_id=camera_link
      - device_type=d435
      - translation_x=-0.00640796
      - translation_z=0.00796752
      - rotation_x=-0.529877
      - camera_name=camera
      - translation_y=-0.0551158
      - frame_id=tool0
    stdin_open: true # docker run -i
    tty: true # docker run -t
    command:
      - bash
      - -c
      - |
        export CYCLONEDDS_URI=file:///cyclonedds.xml
        source /ros_entrypoint.sh
        ros2 launch realsense_camera_calibrated realsense_camera_calibrated.py rotation_z:=-0.467606 rotation_y:=0.53423 rotation_w:=-0.463867 child_frame_id:=camera_link device_type:=d435 translation_x:=-0.00640796 translation_z:=0.00796752 rotation_x:=-0.529877 camera_name:=camera translation_y:=-0.0551158 frame_id:=tool0 
  aruco_marker_publish:
    image: registry.gitlab.cc-asp.fraunhofer.de/ipa326/demonstrator/50y-robotic-demo/aruco_marker_publish_humble:50y_v1.0.1
    volumes:
      - ./cyclonedds.xml:/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros-network
    environment:
      - NETINTERFACE=eth0
      - DISPLAY=${DISPLAY}
      # for application
      - reference_frame=world
      - raw_image_topic=camera/color/image_raw
      - camera_frame=camera_color_optical_frame
      - marker_size_arg=0.02
      - camera_info_topic=camera/color/info
    stdin_open: true # docker run -i
    tty: true # docker run -t
    command:
      - bash
      - -c
      - |
        export CYCLONEDDS_URI=file:///cyclonedds.xml
        source /ros_entrypoint.sh
        ros2 launch aruco_ros mock_aruco_marker_pub.launch.py reference_frame:=world raw_image_topic:=camera/color/image_raw camera_frame:=camera_color_optical_frame marker_size_arg:=0.02 camera_info_topic:=camera/color/info 
  ur_driver:
    image: registry.gitlab.cc-asp.fraunhofer.de/ipa326/demonstrator/50y-robotic-demo/ur_driver_humble:50y_v1.0.1
    volumes:
      - ./cyclonedds.xml:/cyclonedds.xml
      - /tmp/.X11-unix:/tmp/.X11-unix
    networks:
      - ros-network
      - ur5e
    ports:
      - 50002:50002
    environment:
      - NETINTERFACE=eth0
      - DISPLAY=${DISPLAY}
      # for application
      - activate_joint_controller=true
      - robot_ip=192.168.56.2
      - ur_type=ur5e
      - initial_joint_controller=joint_trajectory_controller
      - use_fake_hardware=false
    stdin_open: true # docker run -i
    tty: true # docker run -t
    command:
      - bash
      - -c
      - |
        export CYCLONEDDS_URI=file:///cyclonedds.xml
        source /ros_entrypoint.sh
        ros2 launch ur_robot_driver ur_control.launch.py activate_joint_controller:=true robot_ip:=192.168.56.2 ur_type:=ur5e initial_joint_controller:=joint_trajectory_controller use_fake_hardware:=false 
